  <!-- decorative ring behind number -->
  <circle cx="175" cy="118" r="52" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.9"/>
  <circle cx="175" cy="118" r="47" fill="#FDF1EB" opacity="0.55"/>

  <text x="175" y="106" text-anchor="middle" font-family="Golos Text" font-weight="700" font-size="8" letter-spacing="3" fill="#7C6E82">ОФИС</text>
  <text x="175" y="152" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="52" fill="#C43D6E">427</text>

