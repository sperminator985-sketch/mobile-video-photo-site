  <line x1="60" y1="176" x2="290" y2="176" stroke="#C43D6E" stroke-width="0.6" opacity="0.35"/>

  <!-- website -->
  <g transform="translate(112,182)">
    <circle cx="4" cy="4" r="4" fill="none" stroke="#2B2A44" stroke-width="0.9"/>
    <line x1="0" y1="4" x2="8" y2="4" stroke="#2B2A44" stroke-width="0.7"/>
    <ellipse cx="4" cy="4" rx="1.7" ry="4" fill="none" stroke="#2B2A44" stroke-width="0.7"/>
  </g>
  <text x="122" y="188" font-family="Golos Text" font-weight="700" font-size="8" fill="#2B2A44">icebergvideo.ru</text>
