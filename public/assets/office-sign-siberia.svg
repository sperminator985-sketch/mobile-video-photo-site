<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360mm" height="200mm">
  <defs>
    <clipPath id="signclip"><rect x="0" y="0" width="360" height="200" rx="9"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B518A"/>
      <stop offset="45%" stop-color="#2E416F"/>
      <stop offset="100%" stop-color="#1E2C4F"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6D9"/>
      <stop offset="18%" stop-color="#D4A94F"/>
      <stop offset="38%" stop-color="#8A6414"/>
      <stop offset="55%" stop-color="#F6E6AD"/>
      <stop offset="72%" stop-color="#B9822C"/>
      <stop offset="88%" stop-color="#FFF6D9"/>
      <stop offset="100%" stop-color="#CAA254"/>
    </linearGradient>

    <linearGradient id="goldsoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6E6AD"/>
      <stop offset="100%" stop-color="#C99B3C"/>
    </linearGradient>

    <linearGradient id="berg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7BAE4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A7BAE4" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF1EB"/>
      <stop offset="100%" stop-color="#F3DCD1"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.75">
      <stop offset="0%" stop-color="#8FA6DC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8FA6DC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#signclip)">
    <rect x="0" y="0" width="360" height="200" fill="url(#bg)"/>
    <rect x="0" y="0" width="360" height="200" fill="url(#glow)"/>

    <!-- iceberg silhouettes -->
    <path d="M -20 200 L 42 96 L 76 138 L 99 112 L 154 200 Z" fill="url(#berg)"/>
    <path d="M 216 200 L 276 104 L 309 146 L 331 118 L 390 200 Z" fill="url(#berg)"/>
    <g stroke="#A7BAE4" stroke-opacity="0.16" stroke-width="0.4">
      <path d="M 42 96 L 64 200 M 276 104 L 296 200"/>
    </g>
  </g>

  <!-- frame -->
  <rect x="4" y="4" width="352" height="192" rx="7" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <rect x="7.5" y="7.5" width="345" height="185" rx="5" fill="none" stroke="url(#gold)" stroke-width="0.45" opacity="0.7"/>

  <!-- iceberg mark -->
  <g transform="translate(180 24)">
    <path d="M -11 8 L 0 -11 L 6 -1 L 10 -6 L 17 8 Z" fill="none" stroke="url(#goldsoft)" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M -15 11 L 19 11" stroke="url(#goldsoft)" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- company name -->
  <text x="180" y="61" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="19" letter-spacing="2.2" fill="url(#gold)">SIBERIA ART LTD.</text>

  <!-- divider -->
  <g opacity="0.85">
    <path d="M 100 76 L 171 76 M 189 76 L 260 76" stroke="url(#gold)" stroke-width="0.5"/>
    <path d="M 180 72.5 L 183.4 76 L 180 79.5 L 176.6 76 Z" fill="url(#goldsoft)"/>
  </g>

  <text x="180" y="88" text-anchor="middle" font-family="Golos Text" font-weight="600" font-size="6.4" letter-spacing="6" fill="#C8D4F0">МЕДИА-ГРУППА</text>

  <!-- service tiles -->
  <g>
    <!-- 1: web -->
    <rect x="18" y="96" width="78" height="50" rx="7" fill="url(#tile)" stroke="#D4A94F" stroke-opacity="0.35" stroke-width="0.5"/>
    <g transform="translate(57 116)" stroke="url(#goldsoft)" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-13" y="-8.5" width="26" height="17.5" rx="2.2"/>
      <path d="M -13 -4 L 13 -4"/>
      <circle cx="-10" cy="-6.3" r="0.75" fill="url(#goldsoft)" stroke="none"/>
      <circle cx="-7.4" cy="-6.3" r="0.75" fill="url(#goldsoft)" stroke="none"/>
      <circle cx="-4.8" cy="-6.3" r="0.75" fill="url(#goldsoft)" stroke="none"/>
      <path d="M -5 6 L -8.5 2.5 L -5 -1"/>
      <path d="M 5 6 L 8.5 2.5 L 5 -1"/>
      <path d="M 1.6 -1.4 L -1.6 6.4"/>
    </g>
    <text x="57" y="139" text-anchor="middle" font-family="Golos Text" font-weight="700" font-size="4.4" letter-spacing="0.7" fill="#EAF0FF">САЙТЫ И ПРИЛОЖЕНИЯ</text>

    <!-- 2: video -->
    <rect x="100" y="96" width="78" height="50" rx="7" fill="url(#tile)" stroke="#D4A94F" stroke-opacity="0.35" stroke-width="0.5"/>
    <g transform="translate(139 116)" stroke="url(#goldsoft)" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-12" y="-7" width="17" height="14" rx="2.5"/>
      <path d="M 5 -2 L 12 -6.5 L 12 6.5 L 5 2 Z"/>
      <circle cx="-3.5" cy="0" r="3.2"/>
      <path d="M -14 10.5 L 14 10.5" opacity="0.55"/>
    </g>
    <text x="139" y="139" text-anchor="middle" font-family="Golos Text" font-weight="700" font-size="4.6" letter-spacing="1.1" fill="#EAF0FF">ВИДЕОСЪЁМКА</text>

    <!-- 3: photo -->
    <rect x="182" y="96" width="78" height="50" rx="7" fill="url(#tile)" stroke="#D4A94F" stroke-opacity="0.35" stroke-width="0.5"/>
    <g transform="translate(221 116)" stroke="url(#goldsoft)" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -12 -4 L -6.5 -4 L -4.5 -7.5 L 4.5 -7.5 L 6.5 -4 L 12 -4 Q 13 -4 13 -3 L 13 6.5 Q 13 7.5 12 7.5 L -12 7.5 Q -13 7.5 -13 6.5 L -13 -3 Q -13 -4 -12 -4 Z"/>
      <circle cx="0" cy="1.2" r="4.6"/>
      <circle cx="9" cy="-1.4" r="0.7" fill="url(#goldsoft)" stroke="none"/>
      <path d="M -14 10.5 L 14 10.5" opacity="0.55"/>
    </g>
    <text x="221" y="139" text-anchor="middle" font-family="Golos Text" font-weight="700" font-size="4.6" letter-spacing="1.1" fill="#EAF0FF">ФОТОСЪЁМКА</text>

    <!-- 4: audio -->
    <rect x="264" y="96" width="78" height="50" rx="7" fill="url(#tile)" stroke="#D4A94F" stroke-opacity="0.35" stroke-width="0.5"/>
    <g transform="translate(303 116)" stroke="url(#goldsoft)" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-3.2" y="-9" width="6.4" height="11.5" rx="3.2"/>
      <path d="M -7.5 -0.5 Q -7.5 6.5 0 6.5 Q 7.5 6.5 7.5 -0.5"/>
      <path d="M 0 6.5 L 0 10.5"/>
      <path d="M -11 -3 L -11 3 M -14 -1 L -14 1 M 11 -3 L 11 3 M 14 -1 L 14 1" opacity="0.8"/>
    </g>
    <text x="303" y="139" text-anchor="middle" font-family="Golos Text" font-weight="700" font-size="4.6" letter-spacing="1.1" fill="#EAF0FF">АУДИОЗАПИСЬ</text>
  </g>

  <!-- bottom: office plate -->
  <rect x="262" y="152" width="80" height="36" rx="7" fill="url(#plate)"/>
  <rect x="262" y="152" width="80" height="36" rx="7" fill="none" stroke="url(#gold)" stroke-width="0.7"/>
  <text x="302" y="164" text-anchor="middle" font-family="Golos Text" font-weight="700" font-size="4.6" letter-spacing="3.4" fill="#7C6E82">ОФИС</text>
  <text x="302" y="183" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="18" fill="#C43D6E">427</text>

  <!-- bottom: contacts -->
  <text x="18" y="160" font-family="Unbounded" font-weight="700" font-size="7.2" fill="#F6E6AD">Идея. Съёмка. Эфир.</text>
  <text x="18" y="172" font-family="Golos Text" font-weight="600" font-size="5.4" letter-spacing="0.4" fill="#DCE4F7">пр. Фрунзе, 20 · +7 (909) 547-23-25</text>
  <text x="18" y="182.5" font-family="Golos Text" font-weight="600" font-size="5.4" letter-spacing="0.4" fill="#DCE4F7">daumsam@mail.ru</text>
</svg>
